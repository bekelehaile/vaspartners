# VAS Partners STAGE stack (feature testing — does NOT touch production)
#
#   Access: https://vaspartnersportal.ethiotelecom.et:8443
#   Ship:   ./deploy-staging.sh
#
# Isolated project/containers/volumes/images from production (compose.prod.yml).
#
name: vaspartners-stage

x-backend-env: &backend-env
  APP_URL: https://vaspartnersportal.ethiotelecom.et:8443
  FRONTEND_URL: https://vaspartnersportal.ethiotelecom.et:8443
  DB_CONNECTION: pgsql
  DB_HOST: pgbouncer
  DB_PORT: "5432"
  DB_DATABASE: vaspartners
  DB_USERNAME: vas
  DB_PASSWORD: secret
  DB_EMULATE_PREPARES: "false"
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_QUEUE_RETRY_AFTER: "960"
  QUEUE_OTP: sms-otp
  QUEUE_SMS: sms
  QUEUE_IMPORT: import
  QUEUE_EXPORT: export
  QUEUE_UTILITY: default
  SANCTUM_STATEFUL_DOMAINS: "vaspartnersportal.ethiotelecom.et:8443,vaspartnersportal.ethiotelecom.et"
  FAYDA_REDIRECT_URI: https://vaspartnersportal.ethiotelecom.et:8443/callback
  VAS_SEED_ON_START: "true"
  OPEN_TICKET_LIMIT_EXEMPT_PHONES: "909090909"
  TRUSTED_PROXIES: "*"

services:
  postgres:
    image: postgres:18-alpine
    container_name: vaspartners-stage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaspartners
      POSTGRES_USER: vas
      POSTGRES_PASSWORD: secret
    ports:
      - "45432:5432"
    volumes:
      - vaspartners-stage-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vas -d vaspartners"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - vaspartners-stage-network

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: vaspartners-stage-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vas:secret@postgres:5432/vaspartners
      POOL_MODE: session
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "46432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vaspartners-stage-network

  redis:
    image: redis:7-alpine
    container_name: vaspartners-stage-redis
    restart: unless-stopped
    ports:
      - "46379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vaspartners-stage-network

  backend:
    image: vaspartners-stage-php:latest
    container_name: vaspartners-stage-app
    build:
      context: ./vaspartners
      dockerfile: docker/php/Dockerfile.staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      <<: *backend-env
    volumes:
      - vaspartners-stage-storage:/var/www/html/storage/app
      - vaspartners-stage-logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    networks:
      - vaspartners-stage-network
    extra_hosts:
      - "smsgw.ethiotelecom.et:197.156.68.29"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  queue-otp: &queue-worker-base
    image: vaspartners-stage-php:latest
    container_name: vaspartners-stage-queue-otp
    build:
      context: ./vaspartners
      dockerfile: docker/php/Dockerfile.staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      <<: *backend-env
      VAS_RUN_BOOTSTRAP: "false"
      VAS_SEED_ON_START: "false"
    volumes:
      - vaspartners-stage-storage:/var/www/html/storage/app
      - vaspartners-stage-logs:/var/www/html/storage/logs
    command: ["php", "artisan", "queue:work", "redis", "--queue=sms-otp", "--sleep=1", "--tries=5", "--timeout=90", "--memory=256"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vaspartners-stage-network
    extra_hosts:
      - "smsgw.ethiotelecom.et:197.156.68.29"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  queue-import-1:
    <<: *queue-worker-base
    container_name: vaspartners-stage-queue-import-1
    command: ["php", "artisan", "queue:work", "redis", "--queue=import", "--sleep=1", "--tries=3", "--timeout=900", "--memory=512"]

  queue-export-1:
    <<: *queue-worker-base
    container_name: vaspartners-stage-queue-export-1
    command: ["php", "artisan", "queue:work", "redis", "--queue=export", "--sleep=1", "--tries=3", "--timeout=900", "--memory=512"]

  queue-default:
    <<: *queue-worker-base
    container_name: vaspartners-stage-queue-default
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=1", "--tries=3", "--timeout=120", "--memory=256"]

  queue-sms-1:
    <<: *queue-worker-base
    container_name: vaspartners-stage-queue-sms-1
    command: ["php", "artisan", "queue:work", "redis", "--queue=sms", "--sleep=1", "--tries=3", "--timeout=300", "--memory=256"]

  scheduler:
    image: vaspartners-stage-php:latest
    container_name: vaspartners-stage-scheduler
    build:
      context: ./vaspartners
      dockerfile: docker/php/Dockerfile.staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      <<: *backend-env
      VAS_RUN_BOOTSTRAP: "false"
      VAS_SEED_ON_START: "false"
    volumes:
      - vaspartners-stage-storage:/var/www/html/storage/app
      - vaspartners-stage-logs:/var/www/html/storage/logs
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vaspartners-stage-network
    extra_hosts:
      - "smsgw.ethiotelecom.et:197.156.68.29"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  frontend:
    image: vaspartners-stage-web:latest
    container_name: vaspartners-stage-frontend
    build:
      context: ./vaspartners
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://vaspartnersportal.ethiotelecom.et:8443/api/v1
        NEXT_PUBLIC_SITE_URL: https://vaspartnersportal.ethiotelecom.et:8443
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vaspartners-stage-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: vaspartners-stage-nginx
    restart: unless-stopped
    ports:
      # Direct TLS for stage (prod TLS certs). Does not bind production :443 / :30011.
      - "8443:443"
      - "127.0.0.1:30012:80"
    volumes:
      - ./vaspartners/docker/nginx/default.stage.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/ssl/fullchain-wildcard.crt:/etc/nginx/certs/fullchain.crt:ro
      - /etc/nginx/ssl/ethiotelecom-wildcard.key:/etc/nginx/certs/privkey.key:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - vaspartners-stage-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  vaspartners-stage-pg:
    name: vaspartners-stage-pg
  vaspartners-stage-storage:
    name: vaspartners-stage-storage
  vaspartners-stage-logs:
    name: vaspartners-stage-logs

networks:
  vaspartners-stage-network:
    name: vaspartners-stage-network
    driver: bridge
