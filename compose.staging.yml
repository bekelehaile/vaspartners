# VAS Partners stack under parent /data-disk/applications/vaspartners
#
#   Public: host nginx :443 → 127.0.0.1:30011 → vaspartners-nginx :80
#
# Ship:  ./deploy-staging.sh
# Access:
#   https://vaspartnersportal.ethiotelecom.et
#   https://vaspartnersportal.ethiotelecom.et/admin
#
name: vaspartners

x-backend-env: &backend-env
  APP_URL: https://vaspartnersportal.ethiotelecom.et
  FRONTEND_URL: https://vaspartnersportal.ethiotelecom.et
  DB_CONNECTION: pgsql
  DB_HOST: pgbouncer
  DB_PORT: "5432"
  DB_DATABASE: vaspartners
  DB_USERNAME: vas
  DB_PASSWORD: secret
  DB_EMULATE_PREPARES: "false"
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_QUEUE_RETRY_AFTER: "960"
  QUEUE_OTP: sms-otp
  QUEUE_SMS: sms
  QUEUE_IMPORT: import
  QUEUE_EXPORT: export
  QUEUE_UTILITY: default
  SANCTUM_STATEFUL_DOMAINS: vaspartnersportal.ethiotelecom.et
  FAYDA_REDIRECT_URI: https://vaspartnersportal.ethiotelecom.et/callback
  VAS_SEED_ON_START: "true"
  OPEN_TICKET_LIMIT_EXEMPT_PHONES: "909090909"
  TRUSTED_PROXIES: "*"

services:
  postgres:
    image: postgres:18-alpine
    container_name: vaspartners-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaspartners
      POSTGRES_USER: vas
      POSTGRES_PASSWORD: secret
    ports:
      - "35432:5432"
    volumes:
      - vaspartners-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vas -d vaspartners"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - vaspartners-network

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: vaspartners-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vas:secret@postgres:5432/vaspartners
      POOL_MODE: session
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "36432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vaspartners-network

  redis:
    image: redis:7-alpine
    container_name: vaspartners-redis
    restart: unless-stopped
    ports:
      - "36379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vaspartners-network

  backend:
    image: vaspartners-php:latest
    container_name: vaspartners-app
    build:
      context: ./vaspartners
      dockerfile: docker/php/Dockerfile.staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      <<: *backend-env
    volumes:
      - vaspartners-storage:/var/www/html/storage/app
      - vaspartners-logs:/var/www/html/storage/logs
      # Read-only MVAS dump + attachments for: php artisan vas:migrate-mvas-dump
      - /data-disk/applications/mvasportal/mvasportal/storage/app:/mvas-storage:ro
      - /data-disk/applications/mvasportal/dumps:/mvas-dumps:ro
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    networks:
      - vaspartners-network
    extra_hosts:
      - "smsgw.ethiotelecom.et:197.156.68.29"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Independent queues so OTP / revenue import / CSV export / bulk SMS / utility never block each other.
  queue-otp: &queue-worker-base
    image: vaspartners-php:latest
    container_name: vaspartners-queue-otp
    build:
      context: ./vaspartners
      dockerfile: docker/php/Dockerfile.staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      <<: *backend-env
      VAS_RUN_BOOTSTRAP: "false"
      VAS_SEED_ON_START: "false"
    volumes:
      - vaspartners-storage:/var/www/html/storage/app
      - vaspartners-logs:/var/www/html/storage/logs
    command: ["php", "artisan", "queue:work", "redis", "--queue=sms-otp", "--sleep=1", "--tries=5", "--timeout=90", "--memory=256"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vaspartners-network
    extra_hosts:
      - "smsgw.ethiotelecom.et:197.156.68.29"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Revenue + Filament CSV imports (partners, monthly revenue, phone sync).
  queue-import-1: &queue-import-worker
    <<: *queue-worker-base
    container_name: vaspartners-queue-import-1
    command: ["php", "artisan", "queue:work", "redis", "--queue=import", "--sleep=1", "--tries=3", "--timeout=900", "--memory=512"]

  queue-import-2:
    <<: *queue-import-worker
    container_name: vaspartners-queue-import-2

  # Filament CSV exports (companies, tickets, …).
  queue-export-1: &queue-export-worker
    <<: *queue-worker-base
    container_name: vaspartners-queue-export-1
    command: ["php", "artisan", "queue:work", "redis", "--queue=export", "--sleep=1", "--tries=3", "--timeout=900", "--memory=512"]

  queue-export-2:
    <<: *queue-export-worker
    container_name: vaspartners-queue-export-2

  # Portal notifications and other light utility jobs.
  queue-default:
    <<: *queue-worker-base
    container_name: vaspartners-queue-default
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=1", "--tries=3", "--timeout=120", "--memory=256"]

  # Bulk + revenue SMS campaigns (and transactional partner SMS).
  queue-sms-1: &queue-sms-worker
    <<: *queue-worker-base
    container_name: vaspartners-queue-sms-1
    command: ["php", "artisan", "queue:work", "redis", "--queue=sms", "--sleep=1", "--tries=3", "--timeout=300", "--memory=256"]

  queue-sms-2:
    <<: *queue-sms-worker
    container_name: vaspartners-queue-sms-2

  queue-sms-3:
    <<: *queue-sms-worker
    container_name: vaspartners-queue-sms-3

  scheduler:
    image: vaspartners-php:latest
    container_name: vaspartners-scheduler
    build:
      context: ./vaspartners
      dockerfile: docker/php/Dockerfile.staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      <<: *backend-env
      VAS_RUN_BOOTSTRAP: "false"
      VAS_SEED_ON_START: "false"
    volumes:
      - vaspartners-storage:/var/www/html/storage/app
      - vaspartners-logs:/var/www/html/storage/logs
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vaspartners-network
    extra_hosts:
      - "smsgw.ethiotelecom.et:197.156.68.29"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  frontend:
    image: vaspartners-web:latest
    container_name: vaspartners-frontend
    build:
      context: ./vaspartners
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://vaspartnersportal.ethiotelecom.et/api/v1
        NEXT_PUBLIC_SITE_URL: https://vaspartnersportal.ethiotelecom.et
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vaspartners-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: vaspartners-nginx
    restart: unless-stopped
    ports:
      # Host nginx (:443) proxies here — public access only via :443
      - "127.0.0.1:30011:80"
    volumes:
      - ./vaspartners/docker/nginx/default.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/ssl/fullchain-wildcard.crt:/etc/nginx/certs/fullchain.crt:ro
      - /etc/nginx/ssl/ethiotelecom-wildcard.key:/etc/nginx/certs/privkey.key:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - vaspartners-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  vaspartners-pg:
    name: vaspartners-pg
  vaspartners-storage:
    name: vaspartners-storage
  vaspartners-logs:
    name: vaspartners-logs

networks:
  vaspartners-network:
    name: vaspartners-network
    driver: bridge
